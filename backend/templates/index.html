<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Score Predictor</title>
    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial, sans-serif;
            background:#f5f7fb;
            color:#333;
        }

        .card{
            text-align:center;
            padding:40px;
            border-radius:15px;
            background:#fff;
            box-shadow:0 8px 20px rgba(0,0,0,0.1);
            max-width:550px;
        }

        h1{
            color:#4A6CF7;
            margin-bottom:15px;
        }

        p{
            font-size:1.05rem;
            line-height:1.6;
        }

        .status{
            margin-top:20px;
            color:#28a745;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🧠 Welcome to the Mental Health Score Predictor</h1>

    <p>
        Thank you for visiting! This API uses machine learning to estimate
        mental health scores based on lifestyle and social media usage patterns.
    </p>

    <p class="status">
        ✅ Server is running and ready to accept prediction requests.
    </p>
</div>

</body>
</html>
